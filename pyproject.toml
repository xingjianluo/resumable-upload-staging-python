[project]
name = "resumable-upload-staging-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 默认跑单测即输出业务日志：能看到会话、分片序号与判定结论，无需额外参数
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S.%f"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
